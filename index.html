<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <header>RetroGames - Catálogo de jogos clássicos</header>
    <main class = "container">
        <div class = "titulo-secao">
            <div>
                <h2>Nosso catalogo</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>
            <button id="btnCadastrar" type="button">+ Cadastrar Jogo</button>
        </div>
        <section id="listarJogos" class="listar-jogos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    <dialog id="Cadastro">
        <h2>Novo jogo</h2>
        <form id="formJogo">
            <label for="jogo">Titulo do jogo</label>
            <input type="text" id="jogo" required>
            <label for="plataforma">Nome da plataforma</label>
            <input type="text" id="plataforma" required>
            <label for="desenvolvedora">Empresa desenvolvedora</label>
            <input type="text" id="desenvolvedora" required>
            <label for="imagem">URL da imagem do jogo</label>
            <input type="url" id="imagem" placeholder="https://site.com/capa.jpg" required>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01"required>
            <div class = "acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>
        <script src="script.js"></script>
</body>
</html>
